name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: |
          node --check skill/index.js
          node --check skill/host.js
          node --check scripts/install.mjs
          node --check scripts/selfcheck.mjs

      - name: 清单 JSON 合法性
        run: node -e "JSON.parse(require('fs').readFileSync('skill/skill.json','utf8')); console.log('skill.json ok')"

      - name: 离线自检（不需要 Minecraft / QQ / 依赖）
        run: node scripts/selfcheck.mjs
